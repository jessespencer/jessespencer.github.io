<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas has moved</title>
  <!-- Atlas moved from /rainbow/ to /bible/atlas/. Keeps ?ref= and #hash, and retires the old offline copy. -->
  <script>
    const target = '/bible/atlas/' + location.search + location.hash;
    const retire = navigator.serviceWorker
      ? navigator.serviceWorker.getRegistrations().then((all) => Promise.all(all.filter((r) => new URL(r.scope).pathname.startsWith('/rainbow/')).map((r) => r.unregister())))
      : Promise.resolve();
    Promise.race([retire, new Promise((done) => setTimeout(done, 500))]).finally(() => location.replace(target));
  </script>
  <meta http-equiv="refresh" content="1; url=/bible/atlas/" />
  <link rel="canonical" href="https://jessedestroys.com/bible/atlas/" />
  <style>html { background: #020611; color-scheme: dark; }</style>
</head>
<body>
  <noscript><a href="/bible/atlas/">Atlas has moved to /bible/atlas/</a></noscript>
</body>
</html>
